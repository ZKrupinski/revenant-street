name: Master new Project Z military Foley for stronger body and level
on:
  push:
    paths:
      - .github/workflows/master-z-ballistic-weight-v5.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  master:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install audio mastering tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1
      - name: Master five new Foley recordings with low-frequency punch and transparent ceiling
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::MASTER rifle"
          input="assets/sfx/z-ballistic-rifle-20261103.mp3"
          output="assets/sfx/z-ballistic-rifle-20261103-weight-v5.mp3"
          test -s "$input"
          ffmpeg -nostdin -y -hide_banner -loglevel error -i "$input" \
            -af "highpass=f=43,bass=g=4:f=118:w=0.7,equalizer=f=220:t=q:w=1.0:g=2.1,equalizer=f=3700:t=q:w=1.2:g=-0.8,acompressor=threshold=0.23:ratio=2.15:attack=8:release=110:makeup=1.16,volume=1.27,alimiter=limit=0.85:level=false" \
            -ar 44100 -ac 2 -codec:a libmp3lame -b:a 192k "$output"
          test "$(wc -c < "$output")" -gt 12000
          echo "Original / mastered RMS and peaks:"
          ffmpeg -nostdin -hide_banner -i "$input" -af volumedetect -f null - 2>&1 | grep -E 'mean_volume|max_volume' | tail -2 || true
          ffmpeg -nostdin -hide_banner -i "$output" -af volumedetect -f null - 2>&1 | grep -E 'mean_volume|max_volume' | tail -2 || true
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 "$output"
          echo "::endgroup::"
          echo "::group::MASTER sidearm"
          input="assets/sfx/z-ballistic-sidearm-20261103.mp3"
          output="assets/sfx/z-ballistic-sidearm-20261103-weight-v5.mp3"
          test -s "$input"
          ffmpeg -nostdin -y -hide_banner -loglevel error -i "$input" \
            -af "highpass=f=43,bass=g=4.2:f=118:w=0.7,equalizer=f=220:t=q:w=1.0:g=2.2,equalizer=f=3700:t=q:w=1.2:g=-0.8,acompressor=threshold=0.23:ratio=2.15:attack=8:release=110:makeup=1.16,volume=1.28,alimiter=limit=0.85:level=false" \
            -ar 44100 -ac 2 -codec:a libmp3lame -b:a 192k "$output"
          test "$(wc -c < "$output")" -gt 12000
          echo "Original / mastered RMS and peaks:"
          ffmpeg -nostdin -hide_banner -i "$input" -af volumedetect -f null - 2>&1 | grep -E 'mean_volume|max_volume' | tail -2 || true
          ffmpeg -nostdin -hide_banner -i "$output" -af volumedetect -f null - 2>&1 | grep -E 'mean_volume|max_volume' | tail -2 || true
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 "$output"
          echo "::endgroup::"
          echo "::group::MASTER heavy"
          input="assets/sfx/z-ballistic-heavy-20261103.mp3"
          output="assets/sfx/z-ballistic-heavy-20261103-weight-v5.mp3"
          test -s "$input"
          ffmpeg -nostdin -y -hide_banner -loglevel error -i "$input" \
            -af "highpass=f=43,bass=g=4.6:f=118:w=0.7,equalizer=f=220:t=q:w=1.0:g=2.5,equalizer=f=3700:t=q:w=1.2:g=-0.8,acompressor=threshold=0.23:ratio=2.15:attack=8:release=110:makeup=1.16,volume=1.3,alimiter=limit=0.85:level=false" \
            -ar 44100 -ac 2 -codec:a libmp3lame -b:a 192k "$output"
          test "$(wc -c < "$output")" -gt 12000
          echo "Original / mastered RMS and peaks:"
          ffmpeg -nostdin -hide_banner -i "$input" -af volumedetect -f null - 2>&1 | grep -E 'mean_volume|max_volume' | tail -2 || true
          ffmpeg -nostdin -hide_banner -i "$output" -af volumedetect -f null - 2>&1 | grep -E 'mean_volume|max_volume' | tail -2 || true
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 "$output"
          echo "::endgroup::"
          echo "::group::MASTER parry"
          input="assets/sfx/z-ballistic-parry-20261103.mp3"
          output="assets/sfx/z-ballistic-parry-20261103-weight-v5.mp3"
          test -s "$input"
          ffmpeg -nostdin -y -hide_banner -loglevel error -i "$input" \
            -af "highpass=f=43,bass=g=2.8:f=118:w=0.7,equalizer=f=220:t=q:w=1.0:g=1.5,equalizer=f=3700:t=q:w=1.2:g=-0.8,acompressor=threshold=0.23:ratio=2.15:attack=8:release=110:makeup=1.16,volume=1.2,alimiter=limit=0.85:level=false" \
            -ar 44100 -ac 2 -codec:a libmp3lame -b:a 192k "$output"
          test "$(wc -c < "$output")" -gt 12000
          echo "Original / mastered RMS and peaks:"
          ffmpeg -nostdin -hide_banner -i "$input" -af volumedetect -f null - 2>&1 | grep -E 'mean_volume|max_volume' | tail -2 || true
          ffmpeg -nostdin -hide_banner -i "$output" -af volumedetect -f null - 2>&1 | grep -E 'mean_volume|max_volume' | tail -2 || true
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 "$output"
          echo "::endgroup::"
          echo "::group::MASTER counter"
          input="assets/sfx/z-ballistic-counter-20261103.mp3"
          output="assets/sfx/z-ballistic-counter-20261103-weight-v5.mp3"
          test -s "$input"
          ffmpeg -nostdin -y -hide_banner -loglevel error -i "$input" \
            -af "highpass=f=43,bass=g=4.9:f=118:w=0.7,equalizer=f=220:t=q:w=1.0:g=2.7,equalizer=f=3700:t=q:w=1.2:g=-0.8,acompressor=threshold=0.23:ratio=2.15:attack=8:release=110:makeup=1.16,volume=1.33,alimiter=limit=0.85:level=false" \
            -ar 44100 -ac 2 -codec:a libmp3lame -b:a 192k "$output"
          test "$(wc -c < "$output")" -gt 12000
          echo "Original / mastered RMS and peaks:"
          ffmpeg -nostdin -hide_banner -i "$input" -af volumedetect -f null - 2>&1 | grep -E 'mean_volume|max_volume' | tail -2 || true
          ffmpeg -nostdin -hide_banner -i "$output" -af volumedetect -f null - 2>&1 | grep -E 'mean_volume|max_volume' | tail -2 || true
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 "$output"
          echo "::endgroup::"
      - name: Commit mastered original assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/sfx/*-weight-v5.mp3
          if ! git diff --cached --quiet; then
            git commit -m "Audio: master five new combat Foley clips with stronger bass and louder clean levels"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
