name: Redhood hit crop source audit
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/redhood-hit-audit.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet Pillow
      - name: Inspect real hit sheet bounds, alpha edge contacts and full-body poses
        run: python scripts/audit-redhood-hit.py
      - name: Save visual QA sheet to repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/enemies/redhood-intruder/hit-audit.webp
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Temporarily publish Redhood hit source alpha QA contact sheet'
          git push origin HEAD:main
