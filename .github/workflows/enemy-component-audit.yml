name: Project Z enemy source-island diagnostics
on:
  push:
    branches: [main]
    paths:
      - 'scripts/audit-z-enemy-components.py'
      - '.github/workflows/enemy-component-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Label original enemy hands, boots and stray bitmap islands
        run: |
          python -m pip install -q Pillow numpy opencv-python-headless
          python scripts/audit-z-enemy-components.py
