name: Build red neon twin-chevron direction sprite
on:
  push:
    branches: [main]
    paths:
      - 'scripts/build-edge-arrows-neon-v2.py'
      - '.github/workflows/build-edge-arrows-neon-v2.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sprite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Draw eight alpha-safe flame-flicker arrow cels
        run: python scripts/build-edge-arrows-neon-v2.py
      - name: Commit binary PNG sheet
        shell: bash
        run: |
          git add assets/ui/edge-arrows-neon-v2.png
          if git diff --cached --quiet; then
            echo "Sprite is unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Build transparent flame-flicker arrow sprite sheet"
          git pull --rebase origin main
          git push origin HEAD:main
