name: Repair Red Hood Intruder Crimson Dive Jump Crops
on:
  push:
    branches: [main]
    paths:
      - scripts/rebuild-redhood-jump.py
      - .github/workflows/redhood-jump-rebuild.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install sprite image processor
        run: python -m pip install --quiet Pillow
      - name: Repack original red hood special animation in eight independent full-body cells
        run: python scripts/rebuild-redhood-jump.py
      - name: Commit new production WebP and frame-margin audit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/enemies/redhood-intruder/special-fullframe.webp assets/enemies/redhood-intruder/special-fullframe-bounds.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Repack red hood aerial dive into 8 full-body crop-safe frames'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
