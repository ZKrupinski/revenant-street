name: Repair Red Hood Intruder Crimson Dive Jump Crops
on:
  push:
    branches: [main]
    paths:
      - scripts/rebuild-redhood-jump.py
      - scripts/apply-redhood-jump-runtime.py
      - .github/workflows/redhood-jump-rebuild.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install sprite image processor
        run: python -m pip install --quiet Pillow
      - name: Repack original red hood special animation in eight independent full-body cells
        run: python scripts/rebuild-redhood-jump.py
      - name: Wire corrected sprite into gameplay, floor anchors and smoke tests
        run: python scripts/apply-redhood-jump-runtime.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify repaired red-hood sprites and ground anchors
        run: node tests/redhood-jump-frames.cjs
      - name: Verify full game combat and animation regressions
        run: node tests/assassin-combat.cjs
      - name: Commit new production WebP, runtime fix and frame-margin audit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/enemies/redhood-intruder/special-fullframe.webp assets/enemies/redhood-intruder/special-fullframe-bounds.json index.html tests/assassin-combat.cjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Restore red-hood aerial jump in live combat with eight crop-safe frames'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
