name: Reassemble Redhood complete attack fists
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/redhood-attack-rebuild.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet Pillow
      - name: Restore the three extended fists crossing original cell borders
        run: python scripts/rebuild-redhood-attack.py
      - name: Publish repaired 8-frame sprite sheet and QA preview
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/enemies/redhood-intruder/attack-fullfist.webp assets/enemies/redhood-intruder/attack-fullfist-audit.webp
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Rebuild 8-frame Redhood attack art with the original extended fists restored'
          git push origin HEAD:main
