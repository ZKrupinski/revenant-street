name: Audit Red Hood Intruder Jump Sprite Slices
on:
  push:
    branches: [main]
    paths:
      - scripts/audit-redhood-jump.py
      - .github/workflows/redhood-jump-audit.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet Pillow
      - name: Inspect both entry leap and Crimson Dive per-frame boundaries
        run: python scripts/audit-redhood-jump.py
      - name: Publish QA sprite contact sheets and exact bounds
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/enemies/redhood-entry-audit.webp assets/enemies/redhood-entry-diagnostic.json assets/enemies/redhood-intruder/special-jump-audit.webp assets/enemies/redhood-intruder/special-jump-diagnostic.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Audit red-hood entry jump and Crimson Dive sprite boundaries'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
