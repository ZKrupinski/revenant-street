name: Reassemble redhood death full-body atlas
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/redhood-death-rebuild.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pixel-preserving image tools
        run: python -m pip install --quiet Pillow
      - name: Recover boots displaced across two atlas rows and inspect all eight frames
        run: python scripts/rebuild-redhood-death.py
      - name: Publish rebuilt death atlas and visual QA reference
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/enemies/redhood-intruder/death-fullbody.webp assets/enemies/redhood-intruder/death-fullbody-audit.webp
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Recover complete boots and legs in Redhood 8-frame death atlas'
          git push origin HEAD:main
