name: Import original Project Z hero kiai voice recordings
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-z-hero-kiai.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-hero-kiai:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download three original martial arts voice generations
        env:
          KIAI_A: https://d8j0ntlcm91z4.cloudfront.net/user_3KlCHKRIJO34SPkOC5UMUPo7vEp/hf_20261030_152422_12aa15f0-6d21-4863-b128-48aaa3ed2cab.mp3
          KIAI_B: https://d8j0ntlcm91z4.cloudfront.net/user_3KlCHKRIJO34SPkOC5UMUPo7vEp/hf_20261030_152422_2eb3f67c-aa6e-4d73-ae69-0ce15d6e6018.mp3
          KIAI_POWER: https://d8j0ntlcm91z4.cloudfront.net/user_3KlCHKRIJO34SPkOC5UMUPo7vEp/hf_20261030_152422_6fb479bf-21b9-43cf-8f0b-f6961f4747fa.mp3
        run: |
          set -euo pipefail
          mkdir -p assets/voice
          for spec in "a:$KIAI_A" "b:$KIAI_B" "power:$KIAI_POWER"; do
            key="${spec%%:*}"
            url="${spec#*:}"
            curl -fLsS --retry 3 --retry-all-errors --connect-timeout 15 --max-time 120 "$url" -o "/tmp/hero-${key}.mp3"
            test "$(wc -c < "/tmp/hero-${key}.mp3")" -gt 6000
            # Keep originals bit-identical; Web Audio handles pitch, timing and filtering.
            cp "/tmp/hero-${key}.mp3" "assets/voice/hero-kiai-${key}.mp3"
            test "$(wc -c < "assets/voice/hero-kiai-${key}.mp3")" -gt 6000
            file "assets/voice/hero-kiai-${key}.mp3"
          done
      - name: Commit voice samples to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/voice/hero-kiai-a.mp3 assets/voice/hero-kiai-b.mp3 assets/voice/hero-kiai-power.mp3
          if ! git diff --cached --quiet; then
            git commit -m "assets(audio): add three original sharp martial-arts hero kiai recordings"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
