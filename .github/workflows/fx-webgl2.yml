name: Project Z FX WebGL2 QA
on:
  pull_request:
    paths:
      - index.html
      - assets/z-fx-webgl2.js
      - tests/fx-webgl2.cjs
      - tests/vfx-actor-layer-preview.cjs
      - .github/workflows/fx-webgl2.yml
  push:
    branches: [main]
    paths:
      - index.html
      - assets/z-fx-webgl2.js
      - tests/fx-webgl2.cjs
      - tests/vfx-actor-layer-preview.cjs
      - .github/workflows/fx-webgl2.yml
  workflow_dispatch:
jobs:
  fx:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: WebGL2 FX isolated passes and fallback QA
        run: node tests/fx-webgl2.cjs
      - name: Verify compositor source syntax
        run: node --check assets/z-fx-webgl2.js
