name: Restore Project Z twenty unique attack sprite atlases
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-z-20-attacks.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    concurrency:
      group: project-z-attack-import
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Archive twenty original authored four-by-two eight-frame sprite sheets
        run: |
          python -m pip install -q Pillow
          python scripts/import-z-20-attacks.py
      - name: Validate imported sprite manifest
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          data=json.loads(Path('assets/z-attacks-20/import-report.json').read_text())
          assert data['expected']==20
          assert data['imported']>0, data['errors']
          for name in data['local']:
              file=Path('assets/z-attacks-20')/(name+'.webp')
              assert file.is_file() and file.stat().st_size>12000
          print('Original distinct attack atlases:',data['imported'],'of 20')
          PY
      - name: Commit verified original attack artwork into game assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/z-attacks-20 assets/attacks-20.js
          if ! git diff --cached --quiet; then
            git commit -m 'Art: package validated original Z 20 unique strike motion sprites locally'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
