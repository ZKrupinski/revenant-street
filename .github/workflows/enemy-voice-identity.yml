name: Enemy voice identity QA
on:
  push:
    paths:
      - 'assets/voice/voice-engine.js'
      - 'tests/enemy-voice-identity.cjs'
      - 'index.html'
      - 'play-fixed-20261102.html'
      - '.github/workflows/enemy-voice-identity.yml'
  workflow_dispatch:
jobs:
  voice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/enemy-voice-identity.cjs
      - run: node tests/loading-audio.cjs
