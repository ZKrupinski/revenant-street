name: Project Z smoke tests
on:
  push:
    branches: [main]
    paths:
      - index.html
      - assets/industrial-combat-bgm.js
      - assets/voice/**
      - tests/**
      - .github/workflows/z-smoke.yml
  workflow_dispatch:
jobs:
  combat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Loading and music readiness regression tests
        run: node tests/loading-audio.cjs
      - name: Combat and animation regression tests
        run: node tests/assassin-combat.cjs
      - name: Z locomotion full-body motion planner checks
        run: node tests/z-gait-planner.cjs
      - name: Original Z V3 walk/run and backstep regression
        run: node tests/z-gait-v3-runtime.cjs
