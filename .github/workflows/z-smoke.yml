name: Project Z smoke tests
on:
  push:
    branches: [main]
    paths:
      - index.html
      - assets/ui/z-*.png
      - assets/ui/upgrade-icons-v4.webp
      - assets/industrial-combat-bgm.js
      - assets/voice/**
      - assets/vfx/**
      - tests/**
      - .github/workflows/z-smoke.yml
  workflow_dispatch:
jobs:
  combat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bitmap panel and button artwork QA
        run: node tests/ui-bitmap-frames.cjs
      - name: Rebel Hub centered cards, large icons, and footer regression
        run: node tests/hub-horizontal-layout.cjs
      - name: Approved neon cybernetic UI art direction checks
        run: node tests/neon-cybernetic-ui.cjs
      - name: Loading and music readiness regression tests
        run: node tests/loading-audio.cjs
      - name: Original drum/cannon impact audio QA
        run: node tests/drum-cannon-impact.cjs
      - name: Title first navigation and startup performance regression
        run: node tests/startup-performance.cjs
      - name: Combat and animation regression tests
        run: node tests/assassin-combat.cjs
      - name: One-shot guard and mint healing sprite regression
        run: node tests/heal-guard-vfx.cjs
      - name: Angled enemy-collision effect and overlap cap regression
        run: node tests/vfx-enemy-contact.cjs
      - name: Enlarged bitmap combat effects and source crop safety
        run: node tests/vfx-display-size.cjs
      - name: Per-character enemy impact points, foot anchors, and eight-frame cut safety
        run: node tests/enemy-bitmap-anchors.cjs
      - name: Execution and critical wordmarks plus parry sprite edge safety
        run: node tests/word-vfx-cyber.cjs
      - name: VFX behind actors live preview, URL comparison and readable damage labels
        run: node tests/vfx-actor-layer-preview.cjs
      - name: Shared hand-painted ground slam 8F PNG regression
        run: node tests/ground-slam-bitmap.cjs
      - name: Dash lightning pierce 8F bitmap and on-hit regression
        run: node tests/dash-lightning.cjs
      - name: User-approved parry riposte 8F bitmap integration
        run: node tests/parry-counter-art.cjs
      - name: All eight Iron Mask special frames, no skipped animation poses
        run: node tests/elite-eight-frame.cjs
      - name: Hooded Iron Mask full AI charge-and-strike regression
        run: node tests/elite-ai-integration.cjs
      - name: Z locomotion full-body motion planner checks
        run: node tests/z-gait-planner.cjs
      - name: Original Z V3 walk/run and backstep regression
        run: node tests/z-gait-v3-runtime.cjs
