name: Project Z title fullscreen landscape QA
on:
  push:
    paths:
      - 'index.html'
      - 'play-fixed-20261102.html'
      - 'tests/fullscreen-landscape.cjs'
      - '.github/workflows/fullscreen-landscape.yml'
  workflow_dispatch:
jobs:
  orientation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/fullscreen-landscape.cjs
      - run: node tests/upgrade-vfx-six.cjs
