name: Recut PROJECT Z metallic HUD PNG assets
on:
  push:
    branches: [main]
    paths:
      - 'scripts/repair_project_z_hud_v7.py'
      - '.github/workflows/recut-project-z-hud.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  recut:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Render opaque-matte-free frame and independent PNG numerals
        run: python scripts/repair_project_z_hud_v7.py
      - name: Commit raster sprites to main
        shell: bash
        run: |
          git add assets/ui/ref-wave-frame-v7.png assets/ui/ref-metal-digit-*-v7.png
          if git diff --cached --quiet; then
            echo "No bitmap changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Re-cut alpha HUD bitmaps and standalone metal numerals"
          git pull --rebase origin main
          git push origin HEAD:main
