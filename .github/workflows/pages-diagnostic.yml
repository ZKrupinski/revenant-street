name: Diagnose Project Z GitHub Pages publishing
on:
  push:
    branches:
      - diagnostic/project-z-pages-20261110
    paths:
      - .github/workflows/pages-diagnostic.yml
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  deployments: write
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect Pages configuration and current deployments
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          for endpoint in "/pages" "/pages/deployments/latest" "/pages/builds/latest" "/deployments?environment=github-pages&per_page=6"; do
            echo "=== endpoint: ${endpoint} ==="
            code=$(curl -sS --retry 2 -o /tmp/pages-response.json -w '%{http_code}' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${api}${endpoint}")
            echo "http_status=${code}"
            jq -c 'if type=="array" then map({id,sha,ref,environment,created_at,updated_at}) else {id,html_url,status,state,build_type,source,commit,page_url,created_at,updated_at,errors,error,message} end' /tmp/pages-response.json 2>/dev/null || head -c 450 /tmp/pages-response.json
            echo
          done
      - name: Inspect exact Pages deployment status histories
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          for id in 7671517493 7671457973 7671447949 7671239046 7570647490; do
            echo "=== deployment ${id} ==="
            status=$(curl -sS -o /tmp/status.json -w '%{http_code}' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              "${api}/deployments/${id}/statuses?per_page=10")
            echo "http_status=${status}"
            jq -c 'if type=="array" then map({state,description,environment_url,log_url,created_at,updated_at}) else {message,status} end' /tmp/status.json 2>/dev/null || head -c 300 /tmp/status.json
            echo
          done
      - name: Compare published HTML and FX with current main
        run: |
          set -uo pipefail
          for p in index.html assets/z-fx-webgl2.js; do
            echo "=== ${p} ==="
            curl -fsSL --max-time 20 "https://zkrupinski.github.io/revenant-street/${p}" -o /tmp/current || true
            curl -fsSL --max-time 20 "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/${p}" -o /tmp/gitmain || true
            sha256sum /tmp/current /tmp/gitmain || true
          done
      - name: Retire only finished failed deployments from old blocked SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          stale="a09cc81332f5fdf3deda54652c9ef970f0a5dfcd"
          curl -fsS -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' \
            "${api}/deployments?sha=${stale}&environment=github-pages&per_page=30" -o /tmp/finished-deployments.json
          echo "Old GitHub deployments found: $(jq 'length' /tmp/finished-deployments.json)"
          jq -r '.[].id' /tmp/finished-deployments.json | while read -r id; do
            [ -n "${id}" ] || continue
            curl -fsS -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' \
              "${api}/deployments/${id}/statuses?per_page=5" -o /tmp/last-status.json || continue
            state=$(jq -r '.[0].state // "unknown"' /tmp/last-status.json)
            echo "Deployment ${id} latest status: ${state}"
            if [ "${state}" = "failure" ] || [ "${state}" = "error" ]; then
              code=$(curl -sS -o /tmp/retired.json -w '%{http_code}' \
                -X POST -H "Authorization: Bearer ${GH_TOKEN}" \
                -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/json' \
                -d '{"state":"inactive","description":"Retired obsolete failed Pages release; new main build requested"}' \
                "${api}/deployments/${id}/statuses")
              echo "Mark inactive result: HTTP ${code}"
              jq -c '{state,message}' /tmp/retired.json 2>/dev/null || true
            fi
          done
      - name: Request one clean Pages rebuild of latest main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          endpoint="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds"
          code=$(curl -sS -o /tmp/pages-rebuild.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${endpoint}")
          echo "Pages rebuild API returned HTTP ${code}"
          jq -c '{status,commit,error,message,url}' /tmp/pages-rebuild.json 2>/dev/null || head -c 300 /tmp/pages-rebuild.json
      - name: Test public page and FX module reachability
        run: |
          for address in "https://zkrupinski.github.io/revenant-street/" "https://zkrupinski.github.io/revenant-street/assets/z-fx-webgl2.js"; do
            echo "=== ${address} ==="
            curl -L -sS --max-time 15 -o /tmp/page-body -w 'status=%{http_code} size=%{size_download} redirect=%{redirect_url}\n' "${address}" || true
            head -c 140 /tmp/page-body || true
            echo
          done
