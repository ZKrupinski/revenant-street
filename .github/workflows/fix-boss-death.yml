name: Fix boss death sprite floor alignment
on:
  push:
    paths:
      - '.github/workflows/fix-boss-death.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix-frames:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Re-anchor all eight transparent boss death frames without distortion
        run: |
          python3 -m pip install -q Pillow numpy
          python3 scripts/fix-boss-death.py
      - name: Publish corrected transparent death sprite
        run: |
          git config user.name github-actions
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/boss-hunter/death.webp
          if ! git diff --cached --quiet; then
            git commit -m 'QA: keep all eight boss death frames attached to ground'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
