name: Redhood death foot-pixel audit
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/redhood-death-audit.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet Pillow
      - name: Measure eight redhood death poses and feet from original PNG
        run: python scripts/audit-redhood-death.py
      - name: Publish original 8-cell death contact sheet for visual inspection
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/enemies/redhood-intruder/death-audit.webp
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add redhood death raw 8-frame visual QA contact sheet'
          git push origin HEAD:main
