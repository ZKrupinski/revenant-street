name: Redhood death foot-pixel audit
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/redhood-death-audit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet Pillow
      - name: Measure eight redhood death poses and feet from original PNG
        run: python scripts/audit-redhood-death.py
