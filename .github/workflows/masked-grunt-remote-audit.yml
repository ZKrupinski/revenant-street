name: Project Z live masked grunt atlas edge QA
on:
  push:
    branches: [main]
    paths:
      - 'scripts/audit-z-remote-masked-grunt.py'
      - '.github/workflows/masked-grunt-remote-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scan 12 remote masked raider eight-frame sheets
        run: |
          python -m pip install -q Pillow
          python scripts/audit-z-remote-masked-grunt.py
      - name: Archive 96-frame remote source edge report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: z-masked-grunt-remote-pose-qa
          path: enemy-edge-audit/remote-masked-grunt-audit.json
          if-no-files-found: warn
          retention-days: 30
