name: Rebuild exact original HUD bitmap resources v8
on:
  push:
    branches: [main]
    paths:
      - 'scripts/rebuild-reference-hud-v8.py'
      - '.github/workflows/rebuild-reference-hud-v8.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact PNG processor
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Retain source metal edge while cutting alpha/number masks
        run: python scripts/rebuild-reference-hud-v8.py
      - name: Validate no rectangular background or missing digits
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          base=Path("assets/ui")
          paths=[base/"ref-wave-frame-v8.png",base/"ref-hero-hp-frame-v8.png"]
          paths.extend(base/f"ref-metal-digit-{n}-v8.png" for n in range(10))
          for p in paths:
              im=Image.open(p).convert("RGBA")
              assert im.getchannel("A").getbbox(),p
              assert im.getpixel((0,0))[3]==0,p
              assert im.getpixel((im.width-1,im.height-1))[3]==0,p
              print("PASS",p,im.size)
          PY
      - name: Publish transparent bitmap source crops
        shell: bash
        run: |
          git add assets/ui/ref-wave-frame-v8.png assets/ui/ref-hero-hp-frame-v8.png assets/ui/ref-metal-digit-*-v8.png
          if git diff --cached --quiet; then
            echo "Images unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Rebuild alpha-clean original metal HUD bitmaps v8"
          git pull --rebase origin main
          git push origin HEAD:main
