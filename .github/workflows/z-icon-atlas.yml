name: Build approved neon icon sheet once
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/z-icon-atlas.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  atlas:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image tools
        run: python -m pip install --quiet Pillow
      - name: Download user supplied 25 icon illustrations
        run: |
          curl -fL --retry 3 --connect-timeout 25 'https://d2ol7oe51mr4n9.cloudfront.net/user_3KlCHKRIJO34SPkOC5UMUPo7vEp/82ef4ac9-c419-42fd-a74f-948fa0419f84.png' -o /tmp/project-z-original-25.png
          test "$(stat -c%s /tmp/project-z-original-25.png)" -gt 100000
      - name: Render identical neon frames onto original 25 illustrations
        run: python scripts/build-neon-upgrades.py /tmp/project-z-original-25.png assets/ui/upgrade-icons-v4.webp
      - name: Publish self-contained game icon atlas to repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/ui/upgrade-icons-v4.webp
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add unified 25-icon neon cyberpunk atlas from original skill art'
          git push origin HEAD:main
