name: Import hunter boss eight action atlases
on:
  push:
    paths:
      - '.github/workflows/import-hunter-boss.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Get the original art and generated matching boss actions
        run: |
          mkdir -p assets/boss-hunter/source
          curl --fail --location --silent --show-error --retry 3 --max-time 60 'https://d2ol7oe51mr4n9.cloudfront.net/user_3KlCHKRIJO34SPkOC5UMUPo7vEp/e103d19f-c9d1-4550-9c35-1a664543e106.png' --output assets/boss-hunter/source/idle.png
          curl --fail --location --silent --show-error --retry 3 --max-time 60 'https://d2ol7oe51mr4n9.cloudfront.net/user_3KlCHKRIJO34SPkOC5UMUPo7vEp/7d697328-d51b-44f0-ac4b-255df9b20e91.png' --output assets/boss-hunter/source/walk.png
          curl --fail --location --silent --show-error --retry 3 --max-time 60 'https://d2ol7oe51mr4n9.cloudfront.net/user_3KlCHKRIJO34SPkOC5UMUPo7vEp/7f335d70-705f-4b02-92b6-bb3c5b6ae9aa.png' --output assets/boss-hunter/source/dash.png
          curl --fail --location --silent --show-error --retry 3 --max-time 60 'https://d2ol7oe51mr4n9.cloudfront.net/user_3KlCHKRIJO34SPkOC5UMUPo7vEp/c16d5098-cf62-4879-898e-3feac82d29c7.png' --output assets/boss-hunter/source/hit.png
          curl --fail --location --silent --show-error --retry 3 --max-time 60 'https://d8j0ntlcm91z4.cloudfront.net/user_3KlCHKRIJO34SPkOC5UMUPo7vEp/hf_20261029_074433_8a977dfb-181f-40dc-8274-2f5fa32c2a32.png' --output assets/boss-hunter/source/combo.png
          curl --fail --location --silent --show-error --retry 3 --max-time 60 'https://d8j0ntlcm91z4.cloudfront.net/user_3KlCHKRIJO34SPkOC5UMUPo7vEp/hf_20261029_074433_6c54773c-b636-4196-b2e2-82a278094a49.png' --output assets/boss-hunter/source/slam.png
          curl --fail --location --silent --show-error --retry 3 --max-time 60 'https://d8j0ntlcm91z4.cloudfront.net/user_3KlCHKRIJO34SPkOC5UMUPo7vEp/hf_20261029_074434_cd820c7f-8e37-4690-9ee3-1552b840489b.png' --output assets/boss-hunter/source/taunt.png
          curl --fail --location --silent --show-error --retry 3 --max-time 60 'https://d8j0ntlcm91z4.cloudfront.net/user_3KlCHKRIJO34SPkOC5UMUPo7vEp/hf_20261029_074432_f6806459-13ec-4f94-8d05-f00371a37fbd.png' --output assets/boss-hunter/source/death.png
      - name: Transparent cut and validate 64 frames
        run: |
          python3 -m pip install -q Pillow numpy
          python3 scripts/pack-hunter-boss.py
      - name: Commit packed art
        run: |
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/boss-hunter/
          if ! git diff --cached --quiet; then
            git commit -m 'Art: package eight 8-frame cybernetic hunter boss motions'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
