name: Repair Iron Mask Elite Special Sprite
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-ironmask-special.yml'
      - 'scripts/repair_ironmask_special.py'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install bitmap processor
        run: python -m pip install --quiet Pillow
      - name: Retrieve fixed original illustrated crimson sweep
        run: |
          mkdir -p assets/ironmask-elite/source
          curl --fail --location --retry 3 --connect-timeout 20 \
            https://raw.githubusercontent.com/ZKrupinski/revenant-street/acf1e87129ffc2a9b6cd7fae2141942bf0b11476/assets/ironmask-elite/special.webp \
            --output assets/ironmask-elite/source/special-original.webp
          test "$(stat -c%s assets/ironmask-elite/source/special-original.webp)" -gt 200000
      - name: Rebuild and inspect all eight cropped attack frames
        run: python scripts/repair_ironmask_special.py
      - name: Publish corrected WebP atlas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ironmask-elite/special.webp
          if ! git diff --cached --quiet; then
            git commit -m "Replace clipped Iron Mask special frames with safe full-body animation"
            # Other game edits may land while the sprites are being rebuilt.
            # Replay only the rebuilt bitmap on top of the latest main.
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
